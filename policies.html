<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السياسات والشروط - المجد للتجارة والتوزيع</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--muted:#5b6578;--bg:#f5f6f9;--line:#dfe3ec;--brand:#12356b;--accent:#8f6a1c;--gold:#c0902f}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.9}
header{background:var(--brand);color:#fff;padding:18px;text-align:center;border-bottom:5px solid var(--gold)}
.logo{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:16px;padding:6px}
header h1{font-size:22px;margin-top:6px}
main{max-width:760px;margin:20px auto;padding:0 14px 40px}
section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
h2{font-size:19px;color:var(--brand);margin-bottom:8px;border-right:4px solid var(--gold);padding-right:10px}
ol{padding-right:22px}
li{margin-bottom:6px}
.back{display:inline-block;margin-bottom:14px;color:var(--brand);font-weight:700}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="شعار المجد">
  <h1>المجد للتجارة والتوزيع</h1>
</header>
<main id="main">
  <a class="back" href="index.html">العودة إلى الطلبات</a>
  <section><h2>الشروط والأحكام</h2><ol id="terms"></ol></section>
  <div id="secs"></div>
  <section>
    <h2>للتواصل</h2>
    <p>هاتف وواتساب: <a href="tel:+201223764247" dir="ltr">+201223764247</a></p>
  </section>
</main>
<script src="policies.js"></script>
<script>
const ol = document.getElementById("terms"), secs = document.getElementById("secs");
POLICIES.terms.forEach(t => { const li = document.createElement("li"); li.textContent = t; ol.appendChild(li); });
POLICIES.sections.forEach(x => {
  const s = document.createElement("section"), h = document.createElement("h2"), p = document.createElement("p");
  h.textContent = x.t; p.textContent = x.p; s.append(h, p); secs.appendChild(s);
});
</script>
</body>
</html>
