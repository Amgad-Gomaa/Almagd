<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>المجد للتجارة والتوزيع</title>
    <link rel="icon" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14213d;
        --muted: #5b6578;
        --bg: #f5f6f9;
        --card: #fff;
        --line: #dfe3ec;
        --brand: #12356b;
        --accent: #8f6a1c;
        --gold: #c0902f;
        --wa: #1a8f4c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: Tajawal, Tahoma, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding-bottom: 96px;
        line-height: 1.6;
      }
      header {
        background: var(--brand);
        color: #fff;
        padding: 22px 18px 52px;
        text-align: center;
        border-bottom: 5px solid var(--gold);
      }
      .logo {
        width: 132px;
        height: 132px;
        object-fit: contain;
        background: #fff;
        border-radius: 20px;
        padding: 8px;
      }
      header h1 {
        font-size: 26px;
        font-weight: 800;
        margin-top: 10px;
      }
      header p {
        opacity: 0.9;
        margin-top: 2px;
      }
      .links {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      header a {
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        border-radius: 99px;
        padding: 4px 14px;
      }
      footer {
        max-width: 760px;
        margin: 22px auto 0;
        padding: 0 14px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      footer a {
        color: var(--brand);
        font-weight: 700;
      }
      main {
        max-width: 760px;
        margin: -26px auto 0;
        padding: 0 14px;
      }
      .tools {
        background: var(--card);
        border-radius: 14px;
        padding: 12px;
        border: 1px solid var(--line);
      }
      .tools input {
        width: 100%;
        font: inherit;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--bg);
      }
      .tools input:focus,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .cats {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-top: 10px;
      }
      .cats button {
        flex: none;
        font: inherit;
        border: 1.5px solid var(--line);
        background: #fff;
        border-radius: 99px;
        padding: 4px 16px;
        cursor: pointer;
        color: var(--ink);
      }
      .cats button.on {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .list {
        margin-top: 14px;
        display: grid;
        gap: 10px;
      }
      .item {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .steppers {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .st {
        flex: 1;
        min-width: 150px;
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .st small {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.3;
      }
      .st b {
        display: block;
        line-height: 1.3;
      }
      .spin {
        width: 34px;
        height: 34px;
        border: 4px solid var(--line);
        border-top-color: var(--brand);
        border-radius: 50%;
        margin: 0 auto 10px;
        animation: sp 1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .slow {
        margin-top: 6px;
        color: var(--accent);
        font-weight: 700;
      }
      .retry {
        margin-top: 10px;
        font: 700 15px Tajawal, sans-serif;
        background: var(--brand);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 8px 18px;
        cursor: pointer;
      }
      .item img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--bg);
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-weight: 700;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .price {
        color: var(--accent);
        font-weight: 800;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qty button {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        font: 700 20px/1 Tajawal, sans-serif;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
      }
      .qty button.minus {
        background: var(--line);
        color: var(--ink);
      }
      .qty span {
        min-width: 20px;
        text-align: center;
        font-weight: 700;
      }
      .msg {
        text-align: center;
        color: var(--muted);
        padding: 30px 0;
      }
      .bar {
        position: fixed;
        inset: auto 0 0 0;
        background: #fff;
        border-top: 1px solid var(--line);
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
      }
      .bar div {
        max-width: 760px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .total {
        font-weight: 800;
        font-size: 18px;
        white-space: nowrap;
      }
      .send {
        flex: 1;
        border: 0;
        border-radius: 12px;
        background: var(--wa);
        color: #fff;
        font: 700 17px Tajawal, sans-serif;
        padding: 12px;
        cursor: pointer;
      }
      .send:disabled {
        background: #b8c4be;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="logo.png" alt="شعار المجد للتجارة والتوزيع" />
      <h1 id="storeName"></h1>
      <p id="tagline"></p>
      <div class="links">
        <a id="callLink" href="#"></a
        ><a href="policies.html">السياسات والشروط</a>
      </div>
    </header>

    <main>
      <div class="tools">
        <input
          id="q"
          type="search"
          placeholder="ابحث عن منتج..."
          aria-label="بحث"
        />
        <div class="cats" id="cats"></div>
      </div>
      <div class="list" id="list">
        <div class="msg">
          <div class="spin"></div>
          <p>جاري جلب المنتجات والأسعار...</p>
          <p class="slow" id="slow" hidden>
            ⏳ انتظر من فضلك، الاتصال بطيء قليلاً وجاري جلب المنتجات والأسعار
          </p>
        </div>
      </div>
    </main>

    <footer>
      التوصيل داخل محافظة الشرقية · السبت إلى الخميس ·
      <a href="policies.html">الشروط والأحكام</a>
    </footer>

    <div class="bar">
      <div>
        <span class="total">الإجمالي: <span id="total">0</span> ج.م</span>
        <button class="send" id="send" disabled>
          إرسال الطلب عبر الواتساب
        </button>
      </div>
    </div>

    <script>
      /* ===== الإعدادات: عدّل هنا فقط ===== */
      const CONFIG = {
        storeName: "المجد للتجارة والتوزيع",
        tagline: "اطلب الآن وسيصلك خلال يومي عمل",
        phone: "01223764247", // رقم الهاتف والواتساب
        currency: "ج.م",
        // رابط Google Sheet المنشور كـ CSV (اتركه فارغ لاستخدام المنتجات التجريبية)
        // الأعمدة بالترتيب: الصنف, الاسم, سعر القطعة, الصورة, المعلومات, عدد الكرتونة, سعر الكرتونة
        sheetCsvUrl:
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vSjCKSfOJsrYnkB5zthyUf3sHzn1dFgARoNWyKHBE-s0gIBlEnHP0tubCu06bFCFtXGNpeG1uNlWu9q/pub?gid=0&single=true&output=csv",
      };

      const SAMPLE = [
        {
          cat: "ورد",
          name: "بوكيه ورد بلدي",
          price: 150,
          img: "",
          info: "ورد طبيعي طازج",
          carton: "10",
          cartonPrice: 1400,
        },
        {
          cat: "ورد",
          name: "بوكيه ورد جوري",
          price: 300,
          img: "",
          info: "",
          carton: "6",
          cartonPrice: 1700,
        },
        {
          cat: "نباتات",
          name: "نبتة ظل صغيرة",
          price: 90,
          img: "",
          info: "",
          carton: "12",
          cartonPrice: 1000,
        },
        {
          cat: "هدايا",
          name: "بوكس هدية كبير",
          price: 450,
          img: "",
          info: "",
          carton: "",
          cartonPrice: 0,
        },
      ];

      let products = [],
        cart = {},
        activeCat = "الكل",
        query = "";
      const $ = (id) => document.getElementById(id);

      $("storeName").textContent = CONFIG.storeName;
      $("tagline").textContent = CONFIG.tagline;
      $("callLink").textContent = "📞 +2" + CONFIG.phone;
      $("callLink").href = "tel:" + CONFIG.phone;
      document.title = CONFIG.storeName;

      function parseCSV(text) {
        const rows = [];
        let row = [],
          cell = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"' && text[i + 1] === '"') {
              cell += '"';
              i++;
            } else if (c === '"') q = false;
            else cell += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(cell);
            cell = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else cell += c;
        }
        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }
        return rows;
      }

      const num = (v) =>
        parseFloat(String(v || "").replace(/[^\d.]/g, "")) || 0;

      async function load() {
        if (!CONFIG.sheetCsvUrl) {
          products = SAMPLE;
          return render();
        }
        const slowTimer = setTimeout(() => {
          const el = $("slow");
          if (el) el.hidden = false;
        }, 3000);
        const ctrl = new AbortController();
        const killTimer = setTimeout(() => ctrl.abort(), 30000);
        try {
          const res = await fetch(CONFIG.sheetCsvUrl, { signal: ctrl.signal });
          if (!res.ok) throw new Error();
          const rows = parseCSV(await res.text()).slice(1);
          products = rows
            .map((r) => ({
              cat: (r[0] || "").trim() || "عام",
              name: (r[1] || "").trim(),
              price: num(r[2]),
              img: (r[3] || "").trim(),
              info: (r[4] || "").trim(),
              carton: (r[5] || "").trim(),
              cartonPrice: num(r[6]),
            }))
            .filter((p) => p.name);
          if (!products.length) throw new Error();
          render();
        } catch (e) {
          $("list").innerHTML =
            '<div class="msg"><p>تعذّر جلب المنتجات والأسعار. تأكد من الاتصال بالإنترنت.</p><button class="retry" id="retry">إعادة المحاولة</button></div>';
          $("retry").onclick = () => {
            $("list").innerHTML =
              '<div class="msg"><div class="spin"></div><p>جاري جلب المنتجات والأسعار...</p><p class="slow" id="slow" hidden>⏳ انتظر من فضلك، الاتصال بطيء قليلاً وجاري جلب المنتجات والأسعار</p></div>';
            load();
          };
        } finally {
          clearTimeout(slowTimer);
          clearTimeout(killTimer);
        }
      }

      function renderCats() {
        const cats = ["الكل", ...new Set(products.map((p) => p.cat))];
        $("cats").innerHTML = "";
        cats.forEach((c) => {
          const b = document.createElement("button");
          b.textContent = c;
          if (c === activeCat) b.className = "on";
          b.onclick = () => {
            activeCat = c;
            render();
          };
          $("cats").appendChild(b);
        });
      }

      function stepper(i, key, title, price) {
        const n = (cart[i] && cart[i][key]) || 0;
        const el = document.createElement("div");
        el.className = "st";
        el.innerHTML =
          `<div><b></b><small>${price} ${CONFIG.currency}</small></div>` +
          `<div class="qty"><button class="minus" aria-label="إنقاص">−</button><span>${n}</span><button aria-label="زيادة">+</button></div>`;
        el.querySelector("b").textContent = title;
        const [minus, plus] = el.querySelectorAll("button");
        plus.onclick = () => change(i, key, 1);
        minus.onclick = () => change(i, key, -1);
        return el;
      }

      function render() {
        renderCats();
        const list = $("list");
        const shown = products
          .map((p, i) => ({ p, i }))
          .filter(
            ({ p }) =>
              (activeCat === "الكل" || p.cat === activeCat) &&
              p.name.includes(query)
          );
        list.innerHTML = shown.length
          ? ""
          : '<p class="msg">لا توجد منتجات مطابقة.</p>';
        shown.forEach(({ p, i }) => {
          const el = document.createElement("div");
          el.className = "item";
          el.innerHTML =
            '<div class="top">' +
            (p.img ? `<img src="${p.img}" alt="" loading="lazy">` : "") +
            '<div class="info"><div class="name"></div><div class="meta"></div></div></div><div class="steppers"></div>';
          el.querySelector(".name").textContent = p.name;
          const meta = el.querySelector(".meta");
          meta.textContent = [
            p.info,
            p.carton ? "📦 الكرتونة: " + p.carton + " قطعة" : "",
          ]
            .filter(Boolean)
            .join(" · ");
          if (!meta.textContent) meta.remove();
          const box = el.querySelector(".steppers");
          if (p.price) box.appendChild(stepper(i, "p", "قطعة", p.price));
          if (p.cartonPrice)
            box.appendChild(
              stepper(
                i,
                "c",
                "كرتونة" + (p.carton ? " (" + p.carton + " قطعة)" : ""),
                p.cartonPrice
              )
            );
          list.appendChild(el);
        });
        updateTotal();
      }

      function change(i, key, d) {
        cart[i] = cart[i] || { p: 0, c: 0 };
        cart[i][key] = Math.max(0, cart[i][key] + d);
        if (!cart[i].p && !cart[i].c) delete cart[i];
        render();
      }

      function total() {
        return Object.entries(cart).reduce(
          (s, [i, q]) =>
            s +
            products[i].price * (q.p || 0) +
            products[i].cartonPrice * (q.c || 0),
          0
        );
      }

      function updateTotal() {
        const t = total();
        $("total").textContent = t;
        $("send").disabled = !t;
      }

      $("q").oninput = (e) => {
        query = e.target.value.trim();
        render();
      };

      $("send").onclick = () => {
        const lines = [];
        Object.entries(cart).forEach(([i, q]) => {
          const p = products[i];
          if (q.p)
            lines.push(
              `• ${p.name} — ${q.p} قطعة × ${p.price} = ${q.p * p.price} ${
                CONFIG.currency
              }`
            );
          if (q.c)
            lines.push(
              `• ${p.name} — ${q.c} كرتونة × ${p.cartonPrice} = ${
                q.c * p.cartonPrice
              } ${CONFIG.currency}`
            );
        });
        const text = `طلب جديد:\n${lines.join("\n")}\n\nالإجمالي: ${total()} ${
          CONFIG.currency
        }`;
        const phone = "20" + CONFIG.phone.replace(/\D/g, "").replace(/^0/, "");
        window.open(
          `https://wa.me/${phone}?text=${encodeURIComponent(text)}`,
          "_blank"
        );
      };

      load();
    </script>
  </body>
</html>
