<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | المجد للتجارة والتوزيع</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12356b">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root{color-scheme:light dark;--bg:#f5f6f9;--card:#fff;--ink:#14213d;--muted:#5b6578;--brand:#12356b;--brandt:#12356b;--gold:#c0902f;--line:#dfe3ec}
@media (prefers-color-scheme:dark){:root{--bg:#0e1524;--card:#17213a;--ink:#e8ecf4;--muted:#a3adc0;--brand:#2b5aa8;--brandt:#9bbcf2;--line:#2b3754}}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
header{background:var(--brand);color:#fff;border-bottom:5px solid var(--gold);padding:12px 16px;display:flex;align-items:center;gap:12px}
header img{width:56px;height:56px;background:#fff;border-radius:12px;padding:4px;object-fit:contain}
header b{font-size:19px}
main{max-width:560px;margin:40px auto;padding:0 16px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 20px}
.num{font-size:64px;font-weight:800;color:var(--brandt);line-height:1.2}
p{color:var(--muted);margin:8px 0 20px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 22px;border-radius:12px;background:var(--gold);color:#412402;font-weight:700;text-decoration:none;margin:4px}
a.btn.o{background:transparent;border:1.5px solid var(--brandt);color:var(--brandt)}
</style>
</head>
<body>
<header><img src="/logo.png" width="56" height="56" alt="شعار المجد للتجارة والتوزيع"><b>المجد للتجارة والتوزيع</b></header>
<main><div class="card">
  <div class="num">404</div>
  <h1 style="font-size:24px;color:var(--brandt)">الصفحة غير موجودة</h1>
  <p>الرابط ده مش صحيح أو الصفحة اتنقلت. تقدر تكمل من هنا:</p>
  <a class="btn" href="/">تصفح المنتجات واطلب</a>
  <a class="btn o" href="/about-almagd.html">عن المجد</a>
</div></main>
</body>
</html>
